<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="A Special Surprise for You">
    <meta property="og:description" content="Open your digital birthday gift.">
    <meta property="og:image" content="first.jpeg">
    <title>The Annual / Cinderella</title>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@200;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🎂" />
</head>

<body>

    <div class="grain"></div>
    <div id="cursor"></div>

    <div id="loader">
        <div class="loader-content">
            <span class="count">0</span>%
            <div class="loading-bar"></div>
        </div>
    </div>

    <nav>
        <span>ISSUE NO. 29</span>
        <span>EST. 1997</span> <!-- Use their birth year -->
    </nav>

    <div id="smooth-wrapper">
        <div id="smooth-content">

            <header class="hero">
                <h1 class="big-title">CINDERELLA</h1>
                <div class="hero-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&q=80&w=1000"
                        class="hero-img" alt="Birthday">
                </div>
                <p class="scroll-cue">Please Scroll</p>
            </header>

            <section class="quote-section">
                <h2 class="reveal-type">Live well, live free, <br> like the butterflies on your wrist.</h2>
            </section>

            <section class="gallery">
                <div class="gallery-item tilt">
                    <img src="./first.jpeg" alt="">
                    <p>STRAIGHT FACE FINE AF</p>
                </div>
                <div class="gallery-item tilt" style="margin-top: 100px;">
                    <img src="./second.jpeg" alt="">
                    <p>SMILEY FACE FINE AF</p>
                </div>
            </section>

            <footer>
                <h3>Happy Birthday.</h3>
            </footer>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
